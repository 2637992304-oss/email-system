name: Verify project
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          # Ephemeral, isolated CI database only. Deployment requires user-set passwords.
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: mail_system
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/mail_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: root
      DB_PASSWORD: ''
      LLM_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check sensitive files
        run: python3 scripts/check-secrets.py
      - name: Initialize schema
        run: docker exec -i ${{ job.services.mysql.id }} mysql -uroot mail_system < database/schema.sql
      - name: Backend tests and executable package
        working-directory: backend
        run: ./mvnw -B verify
      - name: Frontend production build
        working-directory: frontend
        run: npm ci && npm run build
      - name: Start backend and verify business flows
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          cd backend
          java -jar target/mail-system-0.0.1-SNAPSHOT.jar > /tmp/email-backend.log 2>&1 &
          cd ..
          python3 scripts/smoke-test.py
