services:
  db:
    image: mysql:8.0
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_DATABASE: mail_system
      MYSQL_USER: ${DB_USERNAME:-mail_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/migrations/V002__reliable_delivery.sql:/docker-entrypoint-initdb.d/02-delivery.sql:ro
      - ./database/migrations/V003__models_and_priority.sql:/docker-entrypoint-initdb.d/03-models.sql:ro
      - ./database/migrations/V004__cursor_indexes.sql:/docker-entrypoint-initdb.d/04-cursor-indexes.sql:ro
      - ./database/migrations/V005__spam_classification_types.sql:/docker-entrypoint-initdb.d/05-spam-types.sql:ro
      - ./database/migrations/V006__receiver_search_order.sql:/docker-entrypoint-initdb.d/06-search-order.sql:ro
      - ./database/migrations/V007__sender_spam_history.sql:/docker-entrypoint-initdb.d/07-spam-history.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" mail_system -e "SELECT 1 FROM user LIMIT 1"']
      interval: 5s
      timeout: 5s
      retries: 40
  backend:
    build:
      context: ./backend
      args:
        MAVEN_MIRROR: ${MAVEN_MIRROR:-https://repo.maven.apache.org/maven2}
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DB_URL: jdbc:mysql://db:3306/mail_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: ${DB_USERNAME:-mail_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (32+ bytes)}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      LLM_API_PATH: ${LLM_API_PATH:-/chat/completions}
      LLM_MODEL: ${LLM_MODEL:-glm-4-flash}
    volumes:
      - attachments:/app/data
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    depends_on:
      - backend
volumes:
  mysql-data:
  attachments:
