log_format mail_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';
upstream mail_backends {
 keepalive 64;
 server backend:8080 max_fails=0;
}
server {
    access_log /var/log/nginx/access.log mail_safe;
 listen 80;
 root /usr/share/nginx/html;
 client_max_body_size 12m;
   proxy_http_version 1.1;
   proxy_set_header Host $host;
   proxy_set_header Connection "";
   proxy_buffering off;
   proxy_cache off;
   proxy_connect_timeout 2s;
   proxy_read_timeout 3600s;
   proxy_next_upstream error timeout http_502 http_504;
   add_header X-Backend $upstream_addr always;
 location = /api/mail/inbox {
   proxy_pass http://mail_backends;
   proxy_read_timeout 5s;
 }
 location /api/ {
   proxy_pass http://mail_backends;
 }
 location / { try_files $uri $uri/ /index.html; }
}
