log_format mail_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';
upstream mail_backends {
 server backend:8080;
 keepalive 64;
}
server {
    access_log /var/log/nginx/access.log mail_safe;
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 12m;
    location /api/ {
        proxy_pass http://mail_backends;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
