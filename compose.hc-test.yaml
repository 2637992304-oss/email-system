services:
  backend:
    ports: ["127.0.0.1:18081:8080"]
    environment:
      MAIL_TEST_FAULT_ENABLED: "true"
      SPRING_RABBITMQ_LISTENER_SIMPLE_AUTO_STARTUP: "false"
      MAIL_CONCURRENCY_LEASE_SECONDS: "10"
    restart: unless-stopped
  backend-b:
    ports: ["127.0.0.1:18082:8080"]
    environment:
      MAIL_TEST_FAULT_ENABLED: "true"
      MAIL_CONCURRENCY_LEASE_SECONDS: "10"
    restart: unless-stopped
